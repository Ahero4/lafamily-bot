[project]
name = "lafamily-bot"
version = "0.6.6"
description = "Семейный Discord-бот LaFamily: учёт МП"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1", "python-dotenv==1.2.4"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
